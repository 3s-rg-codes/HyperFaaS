leaf_id: 1
node_id: leaf-1

grpc_proxy:
  listen_address: "0.0.0.0:50053"

logging:
  level: info
  format: text

server:
  listen_address: "0.0.0.0:50050"
  pprof_address: "0.0.0.0:6060"

# Internal streaming HTTP invocation address used by ingress.
http_invocation_address: "0.0.0.0:50051"

workers:
  - address: "localhost:50052"

dataplane:
  # Default idle time before a function scales to zero if the function spec does not override it.
  scale_to_zero_after: 10s
  # Maximum sandboxes per worker; 0 means unlimited.
  max_instances_per_worker: 0
  # Concurrent starts per worker. Set to 16 for the cold-storm benchmark; 0 uses the bounded default of 8.
  start_tokens_per_worker: 16
  # Per-function concurrent-start cap; 0 derives worker count * start_tokens_per_worker.
  max_starts_per_reconcile: 0
  # Dirigent-copy admission: pending starts count as scale and scale-up bypasses the start limits above.
  # Placement policy and max_instances_per_worker still apply.
  dirigent_strict_admission: false
  # Timeout for leaf-side dials to other platform services.
  dial_timeout: 5s
  # Timeout for starting a sandbox, including image preparation and readiness.
  start_timeout: 60s
  # Timeout for stopping a sandbox.
  stop_timeout: 10s
  # Hold a lower target for this long before stopping. A newer target cancels
  # the old downscale. Use 0s when measuring the controller without damping.
  scale_down_delay: 0s
  # Reconnect backoff for control-plane and status watches.
  status_backoff: 2s
  # Bootstrap fallback for the routing-state heartbeat cadence. The active
  # PlatformConfig.state_refresh_interval wins once the control-plane document
  # arrives; this YAML value is only used before the first document.
  routing_state_heartbeat_interval: 500ms
  # Leaf-to-function HTTP keepalive pool across all function instances.
  http_max_idle_conns: 4096
  # Leaf-to-function idle HTTP keepalives per function instance address.
  http_max_idle_conns_per_host: 200
  # Total active+idle HTTP connections per sandbox.
  http_max_conns_per_host: 200
  # Idle timeout for leaf-to-function HTTP keepalive connections.
  http_idle_conn_timeout: 90s
  # Whether the leaf itself is running in a containerized deployment.
  containerized: false

autoscaling:
  # The autoscaling strategy is fixed in code; only its knobs are configurable.
  # How often the autoscaler samples local signals and applies scale decisions.
  reconcile_interval: 2s
  # Soft in-flight target per sandbox when max_concurrency=0 and the function
  # does not set target_concurrency. Knative default is 100, not a hard breaker.
  unlimited_concurrency_target: 100
  # Fraction of the target to aim for. 0 or 1.0 = no headroom (cold-storm unchanged).
  # 0.7 matches Knative container-concurrency-target-percentage.
  target_utilization: 1.0

controlplane:
  address: "localhost:50054"
  dial_timeout: 5s
